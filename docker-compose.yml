# Practica academica: las claves de abajo son las de los usuarios de prueba.
# La plantilla sin credenciales esta en app/backend/config.example.env.

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: concesionario_db
    command:
      - --default-time-zone=-05:00
      - --log-bin-trust-function-creators=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./base_de_datos/01_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./base_de_datos/02_dml.sql:/docker-entrypoint-initdb.d/02_dml.sql:ro
      - ./base_de_datos/03_vistas.sql:/docker-entrypoint-initdb.d/03_vistas.sql:ro
      - ./base_de_datos/04_procedimientos.sql:/docker-entrypoint-initdb.d/04_procedimientos.sql:ro
      - ./base_de_datos/05_triggers.sql:/docker-entrypoint-initdb.d/05_triggers.sql:ro
      - ./base_de_datos/06_usuarios.sql:/docker-entrypoint-initdb.d/06_usuarios.sql:ro
      - ./base_de_datos/07_indices.sql:/docker-entrypoint-initdb.d/07_indices.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  web:
    build: ./app
    ports:
      - "8080:5000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: concesionario_db
      AUTH_DB_USER: auth_concesionario
      AUTH_DB_PASSWORD: "Auth#2026"
      ADMIN_DB_USER: admin_concesionario
      ADMIN_DB_PASSWORD: "Admin#2026"
      VENDEDOR_DB_USER: vendedor_concesionario
      VENDEDOR_DB_PASSWORD: "Vendedor#2026"
      CONSULTA_DB_USER: consulta_concesionario
      CONSULTA_DB_PASSWORD: "Consulta#2026"
      SECRET_KEY: demo-concesionario-2026
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
