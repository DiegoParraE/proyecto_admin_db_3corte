{% extends "base.html" %}
{% block titulo %}Aviso · Concesionario{% endblock %}
{% block contenido %}
<section class="panel">

  <p>{{ mensaje }}</p>
  <p><a href="{{ url_for('dashboard') if usuario_actual else url_for('login') }}">Volver</a></p>
</section>
{% endblock %}
{% block publico %}
<main class="login-wrap">

    <h1>No se pudo continuar</h1>
    <p>{{ mensaje }}</p>
    <p><a href="{{ url_for('login') }}">Volver al ingreso</a></p>
  </section>
</main>
{% endblock %}
